<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Amazon Video Downloader</h1>
      <p class="subtitle">Téléchargez les vidéos de cette page</p>
    </header>

    <div class="stats">
      <span id="videoCount">0</span> vidéo(s) détectée(s)
    </div>

    <div class="actions">
      <button id="scanBtn" class="btn btn-primary">🔍 Scanner la page</button>
      <button id="downloadAllBtn" class="btn btn-success" disabled>⬇️ Tout télécharger</button>
    </div>

    <div id="videoList" class="video-list">
      <div class="empty-state">
        <p>Cliquez sur "Scanner la page" pour détecter les vidéos</p>
      </div>
    </div>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Recherche de vidéos...</p>
    </div>

    <!-- Modal de prévisualisation vidéo -->
    <div id="previewModal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="previewTitle">Prévisualisation vidéo</h2>
          <button id="closeModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <video id="previewVideo" controls autoplay>
            <source id="previewSource" src="" type="video/mp4">
            Votre navigateur ne supporte pas la lecture vidéo.
          </video>
          <div class="video-info">
            <p id="videoUrl" class="video-info-url"></p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="downloadFromPreview" class="btn btn-download">⬇️ Télécharger cette vidéo</button>
          <button id="closeModalBtn" class="btn btn-secondary">Fermer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
